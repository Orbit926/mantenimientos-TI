server {
    listen 80;
    server_name _;

    # Docker's internal DNS — defer upstream resolution to request time
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15M;

    # ─── Archivos estáticos servidos directo desde volumen (collectstatic) ──
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Archivos de media (PDFs, evidencias, firmas) servidos directo ─────
    location /media/ {
        alias /usr/share/nginx/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ─── API y admin proxiados a gunicorn ─────────────────────────────────
    location /api/ {
        set $upstream backend:8000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        set $upstream backend:8000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── SPA: cualquier otra ruta cae en index.html ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
